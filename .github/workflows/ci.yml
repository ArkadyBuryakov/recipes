name: CI

# Informational (ADR 0012): Coolify deploys main on push independently of this workflow.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Fast checks (format, lint, typecheck, unit)
        run: bun run check
      - name: Integration tests (real Postgres)
        run: bun run test:integration
        env:
          TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes
      - name: Create e2e database
        run: psql postgres://recipes:recipes@localhost:5432/recipes -c "create database e2e"
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: bun run test:e2e
        env:
          CI: "true"
          TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    # Native arm64, the same architecture as the Hetzner CAX11.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
